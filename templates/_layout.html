<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>{% block title %}Magazinul de Salam{% endblock %}</title> <!-- ii permite fiecarei pagini sa seteze titlul -->
		<link href="{{ url_for('static', filename='bootstrap/css/bootstrap.min.css') }}" rel="stylesheet">
		<link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
	</head>

	<body> <!--aici incepe continutul paginii-->
		{% set cart_count = session.get("cart", {}).values() | sum %} <!--numaram cate produse sunt în cos cu Flask. -->

		<nav class="navbar navbar-expand-lg bg-white border-bottom"> <!-- meniu comun pentru toate paginile -->
			<div class="container d-flex align-items-center justify-content-between">
				<a class="navbar-brand fw-bold text-dark" href="{{ url_for('index.index_page') }}">Magazinul de Salam</a> <!--duce la homepage -->

				<ul class = "nav nav-pills"> <!--creeaza o lista de linkuri pt meniu stilizata cu Bootstrap -->
					<li class = "nav-item">
						<a class = "nav-link {% if request.path == '/' %}active{% endif %}" href = "/">Home</a>
					</li>

					<li class = "nav-item">
						<a class = "nav-link {% if request.path.startswith('/cart') %}active{% endif %}" href = "/cart">Cart <span class = "badge text-bg-secondary">{{ cart_count }}</span></a>
					</li>
					<!-- Am facut un link catre cos cu badge pentru numarul de produse-->

					<li class = "nav-item">
						<a class = "nav-link {% if request.path == '/checkout' %}active{% endif %}" href = "/checkout">Checkout</a>
					</li>
					<!-- Am facut un link catre pagina de checkout-->

					<li class = "nav-item">
						<a class = "nav-link {% if request.path == '/contact' %}active{% endif %}" href = "/contact">Contact</a>
					</li>
					<!-- Am facut un link catre pagina de contact-->
				</ul>	
			</div>
		</nav>

		<main class = "container py-4"> <!-- zona pringipala a paginii, cu container de Bootstrap-->
			{% block content %} <!-- intra continuturile din fisiere.html-->
			{% endblock %}
		</main>
		
		<script src="{{ url_for('static', filename='bootstrap/js/bootstrap.bundle.min.js') }}"></script>
		<!--incarca fisierul de javascript de la bootstrap pentru cand o sa vreau lucruri interactive-->
	</body>
</html>
